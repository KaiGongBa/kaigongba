upstream kaigongba_transaction {
    server 127.0.0.1:8022;
    keepalive 32;
}

upstream kaigongba_staffdeck {
    server 127.0.0.1:8021;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.kaigongba.net;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/kaigongba-app/current/frontend;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.kaigongba.net;

    ssl_certificate /etc/letsencrypt/live/app.kaigongba.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.kaigongba.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KGBAPP:10m;
    ssl_session_timeout 1d;

    root /opt/kaigongba-app/current/frontend;
    index index.html;
    client_max_body_size 55m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /api/internal/ { return 404; }

    location = /api/health {
        proxy_pass http://kaigongba_transaction;
        include /etc/nginx/proxy_params;
    }
    location = /api/ready {
        proxy_pass http://kaigongba_transaction;
        include /etc/nginx/proxy_params;
    }
    location = /api/operations/staffdeck/health {
        proxy_pass http://kaigongba_staffdeck/api/health;
        include /etc/nginx/proxy_params;
    }
    location = /api/operations/staffdeck/ready {
        proxy_pass http://kaigongba_staffdeck/api/ready;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/api/(auth|marketplace|transactions|executions|collaboration|disputes)(/|$) {
        proxy_pass http://kaigongba_transaction;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 610s;
    }
    location ~ ^/api/(enterprise/)?external-agent(s|-[a-z-]+)?(/|$) {
        proxy_pass http://kaigongba_transaction;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 610s;
    }

    location /api/ {
        proxy_pass http://kaigongba_staffdeck;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 610s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location ~ /\. { deny all; }
}
